name: Feature request
description: Suggest an improvement to this tool
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying to solve before the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current tool does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A description of the behaviour you propose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No"
